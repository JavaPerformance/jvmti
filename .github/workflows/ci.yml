name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [1.85.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - name: Check every target and feature
        run: cargo check --locked --all-targets --all-features
      - name: Test default features
        run: cargo test --locked
      - name: Test all features
        run: cargo test --locked --all-features
      - name: Deny Clippy diagnostics
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build examples
        run: cargo build --locked --examples --all-features
      - name: Compile the published agent starter
        if: runner.os == 'Linux'
        run: scripts/check-agent-template.sh

  quality:
    name: Formatting, docs, and dependency contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test documentation
        run: cargo test --locked --doc --all-features
      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Prove the zero-dependency contract
        run: scripts/check-zero-dependencies.sh
