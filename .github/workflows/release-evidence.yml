name: Release Evidence

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Attested crate, checksums, and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt
      - name: Install deterministic public API tooling
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup toolchain install nightly-2026-08-17 --profile minimal
          cargo +stable install cargo-public-api --version 0.52.0 --locked
      - name: Read package version
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "directory=target/release-evidence/v$version" >>"$GITHUB_OUTPUT"
      - name: Validate common release gates
        run: scripts/run-release-gates.sh
      - name: Build release evidence
        run: scripts/build-release-evidence.sh
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.directory }}/*.crate
            ${{ steps.package.outputs.directory }}/*.spdx.json
            ${{ steps.package.outputs.directory }}/SHA256SUMS
      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.directory }}/jvmti-bindings-${{ steps.package.outputs.version }}.crate
          sbom-path: ${{ steps.package.outputs.directory }}/jvmti-bindings-${{ steps.package.outputs.version }}.spdx.json
      - name: Upload exact release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvmti-bindings-${{ steps.package.outputs.version }}-release-evidence
          path: ${{ steps.package.outputs.directory }}
          if-no-files-found: error
          retention-days: 30
