# jvmti - Complete JNI/JVMTI bindings for Rust
#
# Zero third-party crate dependencies across every feature and development target.
# ABI-verified against JDK 8 through current JDK 28.

[package]
name = "jvmti-bindings"
version = "3.0.0"
edition = "2024"
rust-version = "1.85"

description = "Complete JNI and JVMTI bindings for Rust with zero third-party crate dependencies. Build JVM agents in pure Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/JavaPerformance/jvmti"
documentation = "https://docs.rs/jvmti-bindings"
readme = "README.md"
keywords = ["jvm", "jni", "jvmti", "java", "agent"]
categories = ["api-bindings", "development-tools::profiling", "external-ffi-bindings"]

[dependencies]
# Intentionally empty. Every feature and development target is crate-free.

[features]
default = []
advanced = []
heap-graph = ["advanced"]
embed = []

[lib]
crate-type = ["rlib"]

[package.metadata.docs.rs]
all-features = true

# Examples are provided as templates, not runnable binaries.
# JVMTI agents must be built as cdylib in your own crate.
# See examples/*.rs for copy-paste templates.
#
# To use, create your own crate with:
#   [lib]
#   crate-type = ["cdylib"]
#
#   [dependencies]
#   jvmti-bindings = "3"

[[example]]
name = "minimal"
crate-type = ["cdylib"]

[[example]]
name = "method_counter"
crate-type = ["cdylib"]

[[example]]
name = "class_logger"
crate-type = ["cdylib"]

[[example]]
name = "profiler"
crate-type = ["cdylib"]

[[example]]
name = "tracer"
crate-type = ["cdylib"]

[[example]]
name = "heap_sampler"
crate-type = ["cdylib"]

[[example]]
name = "attach_logger"
crate-type = ["cdylib"]

[[example]]
name = "event_abi_smoke"
crate-type = ["cdylib"]

[[example]]
name = "callback_idle_bench"
crate-type = ["cdylib"]

[[example]]
name = "callback_noop_bench"
crate-type = ["cdylib"]

[[example]]
name = "callback_counter_bench"
crate-type = ["cdylib"]

[[example]]
name = "embed"
required-features = ["embed"]

[[bench]]
name = "classfile_parse"
harness = false

[[bin]]
name = "jar_parse_bench"
path = "src/bin/jar_parse_bench.rs"
